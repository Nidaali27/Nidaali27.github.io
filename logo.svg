<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Nida Ali logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset=".5" stop-color="#00e0ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;420 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset=".5" stop-color="#00e0ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <radialGradient id="core" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#1f2350"/>
      <stop offset="1" stop-color="#070918"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00e0ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#7c5cff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="orbit" d="M40,210 a170,58 0 1,0 340,0 a170,58 0 1,0 -340,0"/>
  </defs>

  <!-- breathing halo -->
  <circle cx="210" cy="210" r="120" fill="url(#halo)">
    <animate attributeName="r" values="110;140;110" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <g fill="#fff">
    <circle cx="62" cy="80" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="352" cy="66" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="3.1s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="378" cy="300" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="48" cy="330" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="28" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="392" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- dashed outer orbit -->
  <circle cx="210" cy="210" r="196" fill="none" stroke="#8b90b3" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 9">
    <animateTransform attributeName="transform" type="rotate" from="0 210 210" to="360 210 210" dur="40s" repeatCount="indefinite"/>
  </circle>

  <!-- atom orbits with electrons -->
  <g transform="rotate(-30 210 210)">
    <use href="#orbit" fill="none" stroke="#7c5cff" stroke-opacity=".7" stroke-width="2"/>
    <circle r="6" fill="#7c5cff" filter="url(#glow)"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <animateTransform attributeName="transform" type="rotate" values="-30 210 210;330 210 210" dur="24s" repeatCount="indefinite"/>
  </g>
  <g transform="rotate(30 210 210)">
    <use href="#orbit" fill="none" stroke="#00e0ff" stroke-opacity=".65" stroke-width="2"/>
    <circle r="6" fill="#00e0ff" filter="url(#glow)"><animateMotion dur="4s" begin="-1s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <animateTransform attributeName="transform" type="rotate" values="30 210 210;-330 210 210" dur="30s" repeatCount="indefinite"/>
  </g>
  <g transform="rotate(90 210 210)">
    <use href="#orbit" fill="none" stroke="#ff4fd8" stroke-opacity=".6" stroke-width="2"/>
    <circle r="6" fill="#ff4fd8" filter="url(#glow)"><animateMotion dur="5s" begin="-2s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
    <animateTransform attributeName="transform" type="rotate" values="90 210 210;450 210 210" dur="36s" repeatCount="indefinite"/>
  </g>

  <!-- core -->
  <circle cx="210" cy="210" r="80" fill="url(#core)"/>
  <circle cx="210" cy="210" r="82" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="380 135" stroke-linecap="round" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 210 210" to="360 210 210" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="210" r="90" fill="none" stroke="url(#ring)" stroke-width="1.2" stroke-opacity=".6" stroke-dasharray="40 30">
    <animateTransform attributeName="transform" type="rotate" from="360 210 210" to="0 210 210" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- monogram -->
  <text x="210" y="226" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#g)">NA</text>
  <text x="210" y="252" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="3.5" fill="#8b90b3">AI ENGINEER
    <animate attributeName="opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
